<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo escuro acadêmico -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Gradientes de destaque -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Padrão de Grade Matemática -->
    <pattern id="mathGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fundo -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#mathGrid)"/>

  <!-- Eixo Central e Círculo Trigonométrico estilizado -->
  <g transform="translate(400, 240)">
    <!-- Círculos concêntricos de referência -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1.5" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>

    <!-- Eixos Cartesianos do Círculo -->
    <line x1="-180" y1="0" x2="180" y2="0" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5"/>

    <!-- Ângulos notáveis no ciclo -->
    <line x1="0" y1="0" x2="113" y2="-113" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="113" cy="-113" r="5" fill="#38bdf8"/>
    <text x="125" y="-120" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">45° (π/4)</text>

    <line x1="0" y1="0" x2="-80" y2="-138" stroke="#c084fc" stroke-width="2"/>
    <circle cx="-80" cy="-138" r="5" fill="#c084fc"/>
    <text x="-160" y="-145" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold">120° (2π/3)</text>

    <!-- Onda senoidal passando pelo centro -->
    <path d="M -220 0 Q -110 -70 0 0 T 110 0 T 220 0" fill="none" stroke="url(#cyanBlue)" stroke-width="3" opacity="0.65"/>
  </g>

  <!-- Cabeçalho do Card -->
  <rect x="40" y="30" width="720" height="56" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="60" y="65" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" letter-spacing="-0.02em">
    📄 O CICLO E AS EQUAÇÕES TRIGONOMÉTRICAS NAS PROFISSÕES
  </text>

  <!-- Cards flutuantes das Profissões que usam trigonometria -->
  <!-- 1. Engenharia & Arquitetura -->
  <g transform="translate(40, 105)">
    <rect width="225" height="155" rx="12" fill="rgba(30, 41, 59, 0.75)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="18" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="28" y="42" font-size="18">🏗️</text>
    <text x="66" y="34" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">Engenharia Civil</text>
    <text x="66" y="49" fill="#94a3b8" font-family="sans-serif" font-size="11">Cálculo estrutural & rampas</text>
    <text x="18" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="11.5" width="190">
      <tspan x="18" dy="0">• Decomposição de forças vetoriais</tspan>
      <tspan x="18" dy="18">• Cálculo de pontes e treliças</tspan>
      <tspan x="18" dy="18">• Inclinação topográfica com teodolito</tspan>
    </text>
  </g>

  <!-- 2. Games & Programação 3D -->
  <g transform="translate(535, 105)">
    <rect width="225" height="155" rx="12" fill="rgba(30, 41, 59, 0.75)" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="18" fill="rgba(192, 132, 252, 0.2)"/>
    <text x="27" y="42" font-size="18">🎮</text>
    <text x="66" y="34" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold">Jogos & Computação 3D</text>
    <text x="66" y="49" fill="#94a3b8" font-family="sans-serif" font-size="11">Física gráfica & rotação</text>
    <text x="18" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">
      <tspan x="18" dy="0">• Rotação de câmera e personagens</tspan>
      <tspan x="18" dy="18">• Simulação de física de projéteis</tspan>
      <tspan x="18" dy="18">• Trajetórias circulares e colisão</tspan>
    </text>
  </g>

  <!-- 3. Navegação & Aviação / GPS -->
  <g transform="translate(40, 280)">
    <rect width="225" height="155" rx="12" fill="rgba(30, 41, 59, 0.75)" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="18" fill="rgba(52, 211, 153, 0.2)"/>
    <text x="27" y="42" font-size="18">🛰️</text>
    <text x="66" y="34" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold">Navegação & GPS</text>
    <text x="66" y="49" fill="#94a3b8" font-family="sans-serif" font-size="11">Triangulação esférica</text>
    <text x="18" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">
      <tspan x="18" dy="0">• Triangulação por satélites</tspan>
      <tspan x="18" dy="18">• Cartas de rotas aeronáuticas</tspan>
      <tspan x="18" dy="18">• Ajuste angular de rotas de voo</tspan>
    </text>
  </g>

  <!-- 4. Medicina & Diagnóstico -->
  <g transform="translate(535, 280)">
    <rect width="225" height="155" rx="12" fill="rgba(30, 41, 59, 0.75)" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="18" fill="rgba(251, 191, 36, 0.2)"/>
    <text x="27" y="42" font-size="18">🩺</text>
    <text x="66" y="34" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="bold">Medicina & Sinais</text>
    <text x="66" y="49" fill="#94a3b8" font-family="sans-serif" font-size="11">Ondas biológicas & ECG</text>
    <text x="18" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">
      <tspan x="18" dy="0">• Batimentos em eletrocardiograma</tspan>
      <tspan x="18" dy="18">• Ondas cerebrais (EEG)</tspan>
      <tspan x="18" dy="18">• Reconstrução tomográfica</tspan>
    </text>
  </g>

  <!-- Badge inferior com o link do trabalho -->
  <g transform="translate(250, 435)">
    <rect width="300" height="32" rx="16" fill="#059669" opacity="0.95"/>
    <text x="150" y="21" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      📥 Trabalho Acadêmico em PDF • Normas ABNT
    </text>
  </g>
</svg>
